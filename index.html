<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="/src/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 font-sans antialiased">
  <main class="max-w-md mx-auto px-4 py-12">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-white">Minhas Tarefas</h1>
      <p class="mt-2 text-gray-500 text-sm">Organize seu dia com foco</p>
    </header>

    <form id="task-form" class="mb-6">
      <div class="flex gap-2">
        <label for="task-input" class="sr-only">Nova tarefa</label>
        <input
          type="text"
          id="task-input"
          name="task"
          placeholder="O que precisa ser feito?"
          autocomplete="off"
          required
          class="flex-1 px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        >
        <button
          type="submit"
          class="px-6 py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-950"
        >
          Adicionar
        </button>
      </div>
    </form>

    <ul
      id="task-list"
      class="space-y-2"
      aria-label="Lista de tarefas"
    ></ul>

    <div
      id="empty-state"
      class="hidden text-center py-12 text-gray-500"
    >
      <svg class="mx-auto h-12 w-12 text-gray-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
      </svg>
      <p class="text-sm">Nenhuma tarefa ainda. Adicione uma acima!</p>
    </div>

    <footer id="stats" class="mt-6 flex items-center justify-between text-sm text-gray-500 hidden">
      <span id="pending-count">0 pendentes</span>
      <button
        id="clear-completed"
        class="text-blue-400 hover:text-blue-300 transition-colors"
      >
        Limpar concluídas
      </button>
    </footer>
  </main>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
